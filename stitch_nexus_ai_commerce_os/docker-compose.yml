version: '3.8'

services:
  # Frontend - Nginx serving static files
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-commerce-frontend
    ports:
      - "80:80"
    depends_on:
      - meilisearch
      - backend
    networks:
      - ai-commerce-network
    restart: unless-stopped

  # Backend API (Node.js/Express)
  backend:
    image: node:20-alpine
    container_name: ai-commerce-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "5000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@database:5432/${DB_NAME:-ai_commerce}
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_MASTER_KEY=${MEILI_MASTER_KEY}
      - REDIS_URL=redis://redis:6379
      - SCRAPER_API_KEY=${SCRAPER_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - TIKTOK_CONTENT_CLIENT_KEY=${TIKTOK_CONTENT_CLIENT_KEY}
      - TIKTOK_CONTENT_CLIENT_SECRET=${TIKTOK_CONTENT_CLIENT_SECRET}
      - TIKTOK_REDIRECT_URI=${TIKTOK_REDIRECT_URI}
      - TIKTOK_PRIVACY_LEVEL=${TIKTOK_PRIVACY_LEVEL}
      - INSTAGRAM_APP_ID=${INSTAGRAM_APP_ID}
      - INSTAGRAM_APP_SECRET=${INSTAGRAM_APP_SECRET}
      - INSTAGRAM_REDIRECT_URI=${INSTAGRAM_REDIRECT_URI}
    depends_on:
      - database
      - meilisearch
    networks:
      - ai-commerce-network
    restart: unless-stopped
    command: sh -c "npm install && npm start"

  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: ai-commerce-database
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-ai_commerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ai-commerce-network
    restart: unless-stopped

  # Meilisearch - Search Engine
  meilisearch:
    image: getmeili/meilisearch:v1.5
    container_name: ai-commerce-meilisearch
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_ENV=production
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "7700:7700"
    networks:
      - ai-commerce-network
    restart: unless-stopped

  # Redis - Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: ai-commerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai-commerce-network
    restart: unless-stopped
  # Event Bus - RabbitMQ
  eventbus:
    image: rabbitmq:3-management
    container_name: ai-commerce-eventbus
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - ai-commerce-network
    restart: unless-stopped

  # Scheduler (Node.js)
  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    container_name: ai-commerce-scheduler
    environment:
      - EVENT_BUS_URL=amqp://guest:guest@eventbus:5672/
      - BASE_URL=http://backend:3000
    depends_on:
      - eventbus
    networks:
      - ai-commerce-network
    restart: unless-stopped

  # Webhook (Node.js)
  webhook:
    build:
      context: .
      dockerfile: webhook/Dockerfile
    container_name: ai-commerce-webhook
    ports:
      - "4000:4000"
    environment:
      - EVENT_BUS_URL=amqp://guest:guest@eventbus:5672/
    depends_on:
      - eventbus
    networks:
      - ai-commerce-network
    restart: unless-stopped

  # WhatsApp (Twilio) Service
  whatsapp:
    build:
      context: .
      dockerfile: whatsapp/Dockerfile
    container_name: ai-commerce-whatsapp
    environment:
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - WHATSAPP_NUMBER=${WHATSAPP_NUMBER}
      - EVENT_BUS_URL=amqp://guest:guest@eventbus:5672/
    depends_on:
      - eventbus
    networks:
      - ai-commerce-network
    restart: unless-stopped

  # Email Service (SendGrid)
  email:
    build:
      context: .
      dockerfile: email/Dockerfile
    container_name: ai-commerce-email
    environment:
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - EVENT_BUS_URL=amqp://guest:guest@eventbus:5672/
    depends_on:
      - eventbus
    networks:
      - ai-commerce-network
    restart: unless-stopped

  # Payments Service (Stripe)
  payments:
    build:
      context: .
      dockerfile: payments/Dockerfile
    container_name: ai-commerce-payments
    environment:
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - EVENT_BUS_URL=amqp://guest:guest@eventbus:5672/
    depends_on:
      - eventbus
    networks:
      - ai-commerce-network
    restart: unless-stopped

  # ERP Database (PostgreSQL)
  erpdb:
    image: postgres:15-alpine
    container_name: ai-commerce-erpdb
    environment:
      - POSTGRES_USER=${ERP_DB_USER:-erp_user}
      - POSTGRES_PASSWORD=${ERP_DB_PASSWORD:-erp_pass}
      - POSTGRES_DB=${ERP_DB_NAME:-erp_db}
    volumes:
      - erpdb_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - ai-commerce-network
    restart: unless-stopped

  # pgAdmin - Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ai-commerce-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@ai-commerce.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - database
    networks:
      - ai-commerce-network
    restart: unless-stopped

networks:
  ai-commerce-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  meilisearch_data:
    driver: local
  redis_data:
    driver: local
  erpdb_data:
    driver: local
